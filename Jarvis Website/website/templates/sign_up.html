{% extends "base.html" %} {% block title %}Sign Up{% endblock %}
{% block content %}
<main class="auth-page">
  <div class="auth-brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>JARVIS</strong><small>Project intelligence</small></span></div>
  <form method="POST" class="auth-form">
  <h3>Sign Up</h3>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Enter email"
    />
  </div>
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input
      type="text"
      class="form-control"
      id="firstName"
      name="firstName"
      placeholder="Enter first name"
    />
  </div>
  <div class="form-group">
    <label for="companyName">Company Name</label>
    <input type="text" class="form-control" id="companyName" name="companyName" placeholder="Enter company name" required />
  </div>
  <div class="form-group">
    <label for="companyRegNo">Company Registration Number</label>
    <input type="text" class="form-control" id="companyRegNo" name="companyRegNo" placeholder="Enter company registration number" required />
  </div>
  <div class="form-group">
    <label for="companyTaxNo">Company Tax Number</label>
    <input type="text" class="form-control" id="companyTaxNo" name="companyTaxNo" placeholder="Enter company tax number" required />
  </div>
  <div class="form-group">
    <label for="password1">Password</label>
    <input
      type="password"
      class="form-control"
      id="password1"
      name="password1"
      placeholder="Enter password"
    />
  </div>
  <div class="form-group">
    <label for="password2">Password (Confirm)</label>
    <input
      type="password"
      class="form-control"
      id="password2"
      name="password2"
      placeholder="Confirm password"
    />
  </div>
  <div class="form-group">
    <label for="companyPassword1">Company Password</label>
    <input type="password" class="form-control" id="companyPassword1" name="companyPassword1" placeholder="Enter company password" required />
  </div>
  <div class="form-group">
    <label for="companyPassword2">Company Password (Confirm)</label>
    <input type="password" class="form-control" id="companyPassword2" name="companyPassword2" placeholder="Confirm company password" required />
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
  <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
</main>
{% endblock %}
